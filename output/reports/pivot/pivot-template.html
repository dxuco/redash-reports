<title>Marketing Report</title>
<style>
*{box-sizing:border-box}
/* House palette — same names and values as theme.css, so this page sits beside
   the Business Overview, Bonus Cost and FTD reports without clashing. The page
   commits to the light palette on purpose, like every other report in the
   folder, and paints every surface explicitly so it holds on any host ground. */
:root{
 --dark-green:#0B6E3A;--green-hi:#0d7f43;--green-dk:#0a5a30;--sage:#4E9D5C;
 --navy:#0F2A43;--slate:#5B7285;--light-green:#C0DD97;
 --surface-1:#FFFFFF;--plane:#F4F6F5;--row-alt:#F3F7F3;--band:#E3F3E8;
 --panel:#FAFBF9;--divider:#D8DEE0;
 --text-primary:#0F2A43;--text-secondary:#5B7285;--muted:#677181;
 --border:#E5E5E5;--axis:#C3CCD4;--grey:#B7C3CF;--grey-3:#B8C0C8;--grey-4:#A8B4BE;
 --warning:#E67E22;--critical:#C0392B;--accent:#0B6E3A;
 --heat-1:#E1EBE3;--heat-2:#C2D8C7;--heat-3:#A3C5AB;--heat-4:#84B28F;
 --heat-5:#659F73;--heat-6:#468C57;--heat-7:#27793B;--heat-8:#0B5C2C;
 --heat-ink:#243B4A;
 --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 color-scheme:light}

body{margin:0;background:var(--plane);color:var(--text-primary);
 font-family:var(--font-body);font-size:13px;line-height:1.45}

/* ---------------------------------------------------------------- cover */
.cover{background:linear-gradient(135deg,var(--dark-green) 0%,var(--green-dk) 100%);
 color:#fff;padding:.7rem 20px;line-height:1.45}
.cover-inner{max-width:1800px;margin:0 auto;height:34px;display:flex;flex-wrap:nowrap;
 gap:14px;align-items:center;justify-content:space-between}
.cover h1{font-size:1.15rem;font-weight:700;margin:0 0 .15rem;letter-spacing:-0.01em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .sub{color:var(--light-green);font-size:.78rem;margin:0;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.cover .controls{display:flex;gap:8px;align-items:center;flex:none}
.iconbtn{appearance:none;border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.1);
 color:#fff;font:inherit;font-size:12px;font-weight:600;padding:6px 13px;border-radius:20px;
 cursor:pointer;white-space:nowrap}
.iconbtn:hover{background:#fff;color:var(--dark-green)}
.iconbtn[aria-pressed="true"]{background:#fff;color:var(--dark-green)}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);
 border-radius:20px;padding:2px;flex:none}
.seg button{appearance:none;border:0;background:transparent;color:#fff;font:inherit;font-weight:600;
 font-size:12px;padding:5px 13px;border-radius:18px;cursor:pointer;white-space:nowrap}
.seg button:hover{background:rgba(255,255,255,.16)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--dark-green);font-weight:700}

.wrap{max-width:1800px;margin:0 auto;padding:16px 20px 48px;
 display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}}

/* ---------------------------------------------------------------- panels */
.card{background:var(--surface-1);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card>h2{font-size:.8rem;font-weight:700;margin:0;letter-spacing:.04em;text-transform:uppercase;
 color:var(--slate);padding:.65rem .85rem .55rem;border-bottom:1px solid var(--border)}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.chead{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.chead:hover{color:var(--dark-green)}
.chead .tog{appearance:none;width:19px;height:19px;flex:none;border:1px solid var(--axis);
 border-radius:4px;background:var(--surface-1);color:var(--slate);font:inherit;font-size:13px;
 line-height:1;font-weight:700;cursor:pointer;display:flex;align-items:center;
 justify-content:center;padding:0}
.chead:hover .tog{border-color:var(--dark-green);color:var(--dark-green)}
.card.closed .cbody{display:none}
.card.closed h2{border-bottom:0}
.fieldlist{padding:.55rem .6rem .7rem;display:flex;flex-direction:column;gap:3px;
 max-height:min(46vh,460px);overflow:auto}
.grouplabel{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
 color:var(--grey-4);padding:.5rem .25rem .15rem}

/* a field chip: same object in the list and in a zone */
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);
 border:1px solid var(--divider);border-radius:5px;padding:4px 7px;font-size:12px;
 font-weight:600;color:var(--navy);cursor:grab;text-align:left;width:100%;
 font-family:inherit}
.chip:hover{border-color:var(--sage);background:var(--band)}
.chip .grip{color:var(--grey-3);font-size:11px;letter-spacing:-1px;flex:none}
.chip .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.m{background:#fff;border-left:3px solid var(--warning)}
.chip.d{background:#fff;border-left:3px solid var(--dark-green)}
.chip.used{opacity:.42;cursor:default}
.chip.dragging{opacity:.4}
.chip .mv{appearance:none;border:0;background:transparent;color:var(--grey-4);
 cursor:pointer;font-size:10px;line-height:1;padding:2px 3px;border-radius:3px;flex:none}
.chip .mv:hover{color:var(--dark-green);background:var(--band)}
.chip .mv:disabled{opacity:.25;cursor:default}
.chip .mv:disabled:hover{color:var(--grey-4);background:transparent}
.chip .x,.chip .fn{appearance:none;border:0;background:transparent;color:var(--grey-4);
 font:inherit;font-size:12px;line-height:1;cursor:pointer;padding:1px 2px;border-radius:3px;flex:none}
.chip .x:hover,.chip .fn:hover{color:var(--critical);background:var(--band)}
.chip .fn:hover{color:var(--dark-green)}
.chip .fn.on{color:var(--dark-green)}
.chip:focus-visible,.iconbtn:focus-visible,button:focus-visible{outline:2px solid var(--sage);
 outline-offset:1px}
.chip.save{border-style:dashed;border-color:var(--dark-green);background:var(--panel);
 color:var(--dark-green);justify-content:center;cursor:pointer}
.chip.save:hover{background:var(--band)}
.chip.save:disabled{opacity:.5;cursor:not-allowed}
.chip.save:disabled:hover{background:var(--panel)}

/* ---------------------------------------------------------------- zones */
.zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:.7rem .85rem .85rem}
@media (max-width:1180px){.zones{grid-template-columns:repeat(2,minmax(0,1fr))}}
.zone{border:1px dashed var(--axis);border-radius:6px;background:var(--panel);padding:.45rem;
 min-height:76px;display:flex;flex-direction:column;gap:4px}
.zone.over{border-color:var(--dark-green);background:var(--band)}
.zone>.zh{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
 color:var(--slate);display:flex;justify-content:space-between;gap:6px;padding:0 2px 2px}
.zone .hint{color:var(--grey-4);font-weight:500;letter-spacing:0;text-transform:none;font-size:11px}

/* ---------------------------------------------------------------- table */
.tablewrap{overflow:auto;max-height:calc(100vh - 120px);border-radius:0 0 8px 8px}
table{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
th,td{padding:4px 9px;white-space:nowrap;border-bottom:1px solid var(--border)}
thead th{position:sticky;top:0;z-index:3;background:var(--surface-1);color:var(--navy);
 font-weight:700;text-align:right;border-bottom:1px solid var(--axis);font-size:11px}
thead tr:first-child th{top:0}
thead th.lvl{background:var(--row-alt);text-align:center;letter-spacing:.02em}
thead th.rh{text-align:left;z-index:4;left:0;background:var(--surface-1)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--dark-green)}
th .arrow{color:var(--dark-green);font-size:9px;margin-left:3px}
tbody th{text-align:left;font-weight:600;color:var(--navy);position:sticky;left:0;z-index:2;
 background:var(--surface-1)}
tbody tr:nth-child(even) th,tbody tr:nth-child(even) td{background:var(--row-alt)}
tbody tr:hover th,tbody tr:hover td{background:var(--band)}
td{text-align:right;font-variant-numeric:tabular-nums}
td.neg{color:var(--critical)}
td.nil{color:var(--grey-3)}
tr.sub th,tr.sub td{font-weight:700;background:var(--row-alt);color:var(--navy)}
tr.grand th,tr.grand td{font-weight:700;background:var(--band);color:var(--navy);
 border-top:2px solid var(--dark-green);border-bottom:0;position:sticky;bottom:0;z-index:2}
th.ind1{padding-left:22px}th.ind2{padding-left:38px}th.ind3{padding-left:54px}
td.sep,th.sep{border-left:1px solid var(--divider)}

.meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
 padding:.55rem .85rem;border-top:1px solid var(--border);color:var(--muted);font-size:11px}
.meta b{color:var(--navy)}

/* ---------------------------------------------------------------- filter popover */
.pop{position:absolute;z-index:40;background:var(--surface-1);border:1px solid var(--axis);
 border-radius:8px;box-shadow:0 8px 24px rgba(15,42,67,.18);width:250px;padding:.6rem;
 display:flex;flex-direction:column;gap:6px}
.pop h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
 color:var(--slate)}
.pop input[type=search]{font:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--divider);
 border-radius:5px;width:100%;color:var(--navy);background:var(--surface-1)}
.pop .opts{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:1px;
 border:1px solid var(--border);border-radius:5px;padding:3px}
.pop label{display:flex;gap:6px;align-items:center;font-size:12px;padding:2px 4px;border-radius:4px;
 cursor:pointer;color:var(--navy)}
.pop label:hover{background:var(--band)}
.pop label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .row{display:flex;gap:6px;justify-content:space-between}
.tinybtn{appearance:none;font:inherit;font-size:11px;font-weight:600;border:1px solid var(--divider);
 background:var(--surface-1);color:var(--navy);border-radius:5px;padding:3px 9px;cursor:pointer}
.tinybtn:hover{border-color:var(--dark-green);color:var(--dark-green);background:var(--band)}
.tinybtn.primary{background:var(--dark-green);border-color:var(--dark-green);color:#fff}
.tinybtn.primary:hover{background:var(--green-hi);color:#fff}

/* ---------------------------------------------------------------- chart */
.seg2{display:inline-flex;background:var(--panel);border:1px solid var(--divider);
 border-radius:16px;padding:2px}
.seg2 button{appearance:none;border:0;background:transparent;color:var(--slate);font:inherit;
 font-weight:600;font-size:11.5px;padding:3px 12px;border-radius:14px;cursor:pointer}
.seg2 button:hover{color:var(--dark-green)}
.seg2 button[aria-pressed="true"]{background:var(--dark-green);color:#fff}
select.tinysel{font:inherit;font-size:11.5px;font-weight:600;color:var(--navy);
 background:var(--surface-1);border:1px solid var(--divider);border-radius:5px;padding:3px 6px}

.chartbox{padding:.4rem .85rem 1rem}
.headline{display:flex;flex-wrap:wrap;gap:22px;padding:.5rem .1rem .7rem}
.headline div{display:flex;flex-direction:column;gap:1px}
.headline .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
 color:var(--grey-4)}
.headline .v{font-size:1.15rem;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.headline .v.neg{color:var(--critical)}
.headline .s{font-size:11px;color:var(--muted)}
.plot{overflow-x:auto;overflow-y:hidden}
.plot svg{display:block}
/* The legend sits above the plot: it carries each series' window total, so it
   reads as the figures strip the chart is drawn under. */
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:.15rem .1rem .7rem;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--divider);
 background:var(--surface-1);border-radius:14px;padding:3px 10px 3px 7px;font-size:11.5px;
 font-weight:600;color:var(--navy);cursor:pointer;font-family:inherit}
.lg:hover{border-color:var(--dark-green);background:var(--band)}
.lg .sw{width:10px;height:10px;border-radius:2px;flex:none}
.lg .lv{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.lg.off{opacity:.42}
.lg.off .lv{text-decoration:line-through}
.lg.all{border-style:dashed;border-color:var(--dark-green);color:var(--dark-green)}
.charttip{position:fixed;z-index:50;background:var(--navy);color:#fff;border-radius:6px;
 padding:7px 10px;font-size:11.5px;line-height:1.5;pointer-events:none;display:none;
 box-shadow:0 6px 18px rgba(15,42,67,.28);max-width:280px}
.charttip b{color:#fff}
.charttip .r{display:flex;justify-content:space-between;gap:14px}
.charttip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.charttip .tot{border-top:1px solid rgba(255,255,255,.3);margin-top:4px;padding-top:4px;font-weight:700}
.emptychart{padding:22px 14px;color:var(--muted);max-width:640px;line-height:1.6}

.note{padding:.6rem .85rem;font-size:11.5px;color:var(--muted);border-top:1px solid var(--border);
 line-height:1.5}
.note b{color:var(--navy)}
.overlapnote{margin:0 0 8px;padding:.5rem .75rem;font-size:11.5px;line-height:1.5;
 color:#8a5a1f;background:var(--warn-bg);border:1px solid #F1DDB8;border-radius:6px}
.overlapnote:before{content:"⚠ ";}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);
 color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;z-index:60;
 box-shadow:0 6px 20px rgba(15,42,67,.3)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}}
@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
</style>

<div class="cover">
