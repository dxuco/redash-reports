<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GA4 traffic — US, Germany, Canada</title>
<style>
:root{--dark-green:#0B6E3A;--green-hi:#0D7F43;--sage:#4E9D5C;--light-green:#C0DD97;
--band:#E3F3E8;--row-alt:#F3F7F3;--navy:#0F2A43;--slate:#5B7285;--muted:#677181;
--grey:#B7C3CF;--axis:#C3CCD4;--border:#E5E5E5;--surface:#FFFFFF;--plane:#F4F6F5;
--panel:#FAFBF9;--divider:#D8DEE0;--warning:#E67E22;--warn-bg:#FDF6EC;--critical:#C0392B;
--grey-2:#8B93A1;--grey-5:#C6CED4;--tint-1:#E7F1E9;--ramp-navy-2:#4A6480;--ramp-warm-2:#ECA255}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--navy);
font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 72px}
header{background:var(--dark-green);color:#fff;padding:36px 0 30px;margin-bottom:26px}
header .wrap{padding-bottom:0}
h1{margin:0 0 6px;font-size:27px;font-weight:600;letter-spacing:-.2px}
h2{font-size:18px;font-weight:600;margin:36px 0 4px;padding-top:20px;border-top:2px solid var(--dark-green)}
h2 .n{color:var(--grey-2);font-weight:400;margin-right:8px}
.up{color:var(--dark-green)}.dn{color:var(--critical)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin:16px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:right;padding:7px 9px;border-bottom:2px solid var(--divider);color:var(--slate);
font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:var(--band)}
tr.flag td{background:var(--warn-bg)}
tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--warning)}
tr.grp td{font-weight:600;background:var(--row-alt);border-top:2px solid var(--divider)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px;font-size:12.5px;color:var(--slate)}
.legend span{display:flex;align-items:center;gap:6px}
.legend button{font:inherit;font-size:12px;display:flex;align-items:center;gap:5px;
cursor:pointer;background:none;border:1px solid transparent;border-radius:999px;
padding:3px 10px 3px 7px;color:var(--slate)}
.legend button:hover{border-color:var(--grey-5);color:var(--navy)}
.legend button[aria-pressed="false"]{opacity:.4}
.legend button[aria-pressed="false"] .sw{background:var(--grey)!important}
.legend .showall{border-style:dashed;border-color:var(--sage);color:var(--dark-green)}
.legend .static{padding:3px 0;cursor:default}
#ch1 path,#ch3 path,#ch7 path,#ch1 circle,#ch3 circle,#ch7 circle{cursor:pointer}
.sw{width:11px;height:11px;border-radius:2px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.chip{font:inherit;font-size:12.5px;padding:5px 13px;border-radius:999px;cursor:pointer;
background:var(--surface);border:1px solid var(--grey-5);color:var(--slate)}
.chip:hover{border-color:var(--sage);color:var(--dark-green)}
.chip[aria-pressed="true"]{background:var(--dark-green);border-color:var(--dark-green);color:#fff}
.chip.reset{border-style:dashed}
.filterbar{background:var(--panel);border:1px solid var(--border);border-radius:8px;
padding:12px 15px;margin:16px 0}
.filterbar .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;
color:var(--grey-2);margin-bottom:2px}
.scroll{overflow-x:auto}
svg{display:block;max-width:100%}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--divider);
color:var(--muted);font-size:12.5px}
code{background:var(--row-alt);padding:1px 5px;border-radius:3px;font-size:12.5px}
</style></head><body>
<header><div class="wrap">
<h1>GA4 traffic — US, Germany, Canada</h1>
</div></header>
<div class="wrap">

<div class="filterbar">
<div class="lbl">Channel</div>
<div class="chips" id="chips"></div>
</div>

<h2><span class="n">01</span>Monthly sessions</h2>
<div class="panel"><div class="legend" id="lg1"></div><div id="ch1"></div></div>

<h2><span class="n">02</span><span id="drillHead">Inside the channel</span></h2>
<div class="panel"><div class="legend" id="lg3"></div><div id="ch3"></div></div>

<h2><span class="n">03</span>Sessions by day</h2>
<div class="chips" id="dayChips"></div>
<div class="panel"><div class="legend" id="lg4"></div><div id="ch4"></div></div>

<h2><span class="n">04</span>Bounce rate</h2>
<div class="panel"><div class="legend" id="lg5"></div><div id="ch5"></div></div>

<h2><span class="n">05</span>Landing pages by bounce rate</h2>
<div class="panel"><div class="legend" id="lg6"></div><div id="ch6"></div></div>

<h2><span class="n">06</span>Sessions by landing page</h2>
<div class="panel"><div class="legend" id="lg7"></div><div id="ch7"></div></div>

</div>

<script>window.DATA = __DATA__;</script>
<script>
(function(){
var D=window.DATA, M=D.months, C=D.countries, NS='http://www.w3.org/2000/svg';
window.CT=window.CT||{};
var NAMES=D.order, COL=['#0B6E3A','#E67E22','#4A6480','#C0392B','#4E9D5C','#A85410',
 '#0F2A43','#ECA255','#659F73','#8B93A1','#081E33','#F2C48E','#A3C5AB','#5B7285','#B7C3CF'];
/* Filters are views over pre-computed data: the builder emitted every channel's
   monthly series, and the page only switches which one it reads. Default lives
   in `state` AND in the chips' aria-pressed, set together in drawChips(). */
var state={ch:'Organic Search',hidden:{},dHidden:{},pHidden:{},month:'2026-08'};
function visible(){return NAMES.filter(function(c){return !state.hidden[c];});}
function isOnly(c){var v=visible();return v.length===1&&v[0]===c;}
/* Clicking a series isolates it -- people click a thing because they want to
   look at it, not to make it disappear. Clicking the isolated one restores
   everything; alt-click hides just that one. */
function pick(c,alt){
 if(alt){
  if(!state.hidden[c]&&visible().length===1)return;   /* never hide the last one */
  state.hidden[c]=!state.hidden[c];
 } else if(isOnly(c)){ state.hidden={}; }
 else { state.hidden={}; NAMES.forEach(function(o){if(o!==c)state.hidden[o]=true;}); }
 render();
}
function series(country,field){
  if(state.ch==='all')return C[country][field];
  var t=D.monthlyChannels[country][state.ch];
  if(!t)return M.map(function(){return 0;});
  var j=field==='sessions'?0:1;
  return t.map(function(p){return p[j];});
}
/* A month is flagged when a country runs more than 3x its own median month --
   these are the bot/instrumentation spikes. Derived rather than listed, so it
   cannot go stale as countries are added. */
var FLAG={};
NAMES.forEach(function(c){
 var v=C[c].sessions.slice().sort(function(a,b){return a-b;}),
     med=v[Math.floor(v.length/2)]||0;
 C[c].sessions.forEach(function(x,i){ if(med&&x>med*3)FLAG[c+'|'+M[i]]=1; });});
function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
function n(v){return Math.round(v).toLocaleString();}
function pct(a,b){if(!a)return b?'new':'—';var p=(b/a-1)*100;
 return (p>0?'+':'')+(Math.abs(p)<1&&p!==0?(p>0?'<1':'>-1'):Math.round(p))+'%';}
function cls(a,b){return b>=a?'up':'dn';}
function step(mx){var r=mx/4,mg=Math.pow(10,Math.floor(Math.log10(r))),nm=r/mg;
 return (nm<=1?1:nm<=2?2:nm<=2.5?2.5:nm<=5?5:10)*mg;}
var JA=M.map(function(m,i){return i;}),
 P25=M.map(function(m,i){return m<='2025-08'?i:-1;}).filter(function(i){return i>=0;}),
 P26=M.map(function(m,i){return m>='2026-01'&&m<='2026-08'?i:-1;}).filter(function(i){return i>=0;}),
 P25c=P25.filter(function(i){return M[i]<='2025-06';}),
 P26c=P26.filter(function(i){return M[i]<='2026-06';});
function sum(c,idx,f){var a2=series(c,f||'sessions');return idx.reduce(function(a,i){return a+a2[i];},0);}

/* line drawer */
function lines(host,legend,cfg){
 var W=1120,H=cfg.h||320,L=76,R=18,T=16,Bm=48,pw=W-L-R,ph=H-T-Bm;
 var hi=0; cfg.series.forEach(function(s){s.data.forEach(function(v){
  if(v!==null&&v!==undefined)hi=Math.max(hi,v);});});
 if(cfg.max)hi=cfg.max;
 var st=step(hi||1); hi=Math.ceil(hi/st)*st;
 var y=function(v){return T+ph-v/hi*ph;},
     x=function(i){return L+(cfg.labels.length<2?pw/2:i*pw/(cfg.labels.length-1));};
 var svg=el('svg',{viewBox:'0 0 '+W+' '+H,width:'100%'});
 for(var t=0;t<=hi+1e-9;t+=st){
  svg.appendChild(el('line',{x1:L,x2:W-R,y1:y(t),y2:y(t),
   stroke:t===0?'#9aa7b2':'var(--border)','stroke-width':t===0?1.4:1}));
  var tx=el('text',{x:L-10,y:y(t)+4,'text-anchor':'end','font-size':11,fill:'var(--muted)'});
  tx.textContent=cfg.fmt?cfg.fmt(t):n(t); svg.appendChild(tx);}
 if(cfg.flagIdx)cfg.flagIdx.forEach(function(i){
  svg.appendChild(el('rect',{x:x(i)-9,y:T,width:18,height:ph,fill:'#E67E22','fill-opacity':.09}));});
 cfg.series.forEach(function(s){
  var d='',pen=false;
  s.data.forEach(function(v,i){
   if(v===null||v===undefined){pen=false;return;}
   d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; pen=true;});
  var pth=el('path',{d:d,fill:'none',stroke:s.color,'stroke-width':2.2,
   'stroke-linejoin':'round','stroke-linecap':'round'});
  if(cfg.onPick)pth.addEventListener('click',function(e){cfg.onPick(s.name,e.altKey);});
  svg.appendChild(pth);
  s.data.forEach(function(v,i){
   if(v===null||v===undefined)return;
   var c=el('circle',{cx:x(i),cy:y(v),r:3,fill:s.color});
   c.appendChild(el('title')).textContent=cfg.labels[i]+' · '+s.name+' · '+(cfg.fmt?cfg.fmt(v):n(v));
   if(cfg.onPick)c.addEventListener('click',function(e){cfg.onPick(s.name,e.altKey);});
   svg.appendChild(c);});});
 cfg.labels.forEach(function(lb,i){
  if(cfg.dayAxis&&cfg.labels.length>16&&i%2)return;
  var t2=el('text',{x:x(i),y:H-26,'text-anchor':'middle','font-size':10,
   fill:(cfg.flagIdx&&cfg.flagIdx.indexOf(i)>=0)?'#E67E22':'var(--muted)'});
  t2.textContent=cfg.dayAxis?lb:lb.slice(2).replace('-','/'); svg.appendChild(t2);});
 host.appendChild(svg);
}
/* The legend lists every country, including hidden ones -- otherwise there is
   no way to click one back. */
function drawLegend(host){
 host.innerHTML=NAMES.map(function(c,i){
  return '<button type="button" class="leg" data-c="'+c+'" aria-pressed="'+
   (state.hidden[c]?'false':'true')+'"><i class="sw" style="background:'+COL[i]+
   '"></i>'+c+'</button>';}).join('')+
  (visible().length<NAMES.length?'<button type="button" class="showall">Show all</button>':'')+
  '<span class="static" style="color:var(--warning)">'+
  '<i class="sw" style="background:#E67E22;opacity:.35"></i>flagged month</span>';
 Array.prototype.forEach.call(host.querySelectorAll('.leg'),function(b){
  b.addEventListener('click',function(e){pick(b.getAttribute('data-c'),e.altKey);});});
 var sa=host.querySelector('.showall');
 if(sa)sa.addEventListener('click',function(){state.hidden={};render();});
}
function flagged(){return M.map(function(m,i){
 return visible().some(function(c){return FLAG[c+'|'+m];})?i:-1;})
 .filter(function(i){return i>=0;});}
function charts(){
 var h1=document.getElementById('ch1');
 h1.innerHTML='';
 lines(h1,null,{labels:M,flagIdx:flagged(),onPick:pick,
  fmt:function(v){return v>=1000?(v/1000)+'k':''+v;},
  series:visible().map(function(c){return {name:c,color:COL[NAMES.indexOf(c)],
   data:series(c,'sessions')};})});
 drawLegend(document.getElementById('lg1'));}

/* ---- drill-down: the selected channel, by month ---- */
var DCOL=['#0B6E3A','#E67E22','#4A6480','#4E9D5C','#C0392B','#ECA255','#5B7285','#A3C5AB'];
function drillRows(){
 var vis=visible(),agg={},order=[];
 function push(k,arr){
  if(!agg[k]){agg[k]=M.map(function(){return 0;});order.push(k);}
  arr.forEach(function(v,i){agg[k][i]+=v;});}
 if(state.ch==='all'){
  D.channelOrder.forEach(function(k){
   vis.forEach(function(c){
    var t=D.monthlyChannels[c][k];
    if(t)push(k,t.map(function(p){return p[0];}));});});
 } else {
  vis.forEach(function(c){
   var map=D.sourceChannel[c]||{},mon=D.sourceMonthly[c]||{};
   Object.keys(mon).forEach(function(src){
    if(map[src]===state.ch)push(src,mon[src]);});});
 }
 return order.map(function(k){
   var a=agg[k];return {k:k,data:a,tot:a.reduce(function(x,y){return x+y;},0)};})
  .filter(function(r){return r.tot>0;})
  .sort(function(x,y){return y.tot-x.tot;}).slice(0,8);
}
function dPick(k,alt){
 var rows=drillRows(),names=rows.map(function(r){return r.k;});
 var vis=names.filter(function(x){return !state.dHidden[x];});
 if(alt){ if(!state.dHidden[k]&&vis.length===1)return; state.dHidden[k]=!state.dHidden[k]; }
 else if(vis.length===1&&vis[0]===k){ state.dHidden={}; }
 else { state.dHidden={}; names.forEach(function(o){if(o!==k)state.dHidden[o]=true;}); }
 drill();
}
function drill(){
 var rows=drillRows(),vis=visible();
 document.getElementById('drillHead').textContent=
  state.ch==='all'?'Channel mix by month':state.ch+' by month';
 var shown=rows.filter(function(r){return !state.dHidden[r.k];});
 if(!shown.length){state.dHidden={};shown=rows;}
 var host=document.getElementById('ch3'); host.innerHTML='';
 if(!rows.length){
  document.getElementById('lg3').innerHTML='';
  return;}
 lines(host,null,{labels:M,flagIdx:flagged(),h:330,onPick:dPick,
  fmt:function(v){return v>=1000?(v/1000)+'k':''+v;},
  series:shown.map(function(r){
   return {name:r.k,color:DCOL[rows.indexOf(r)%DCOL.length],data:r.data};})});
 var lg=document.getElementById('lg3');
 lg.innerHTML=rows.map(function(r,i){
  return '<button type="button" class="dleg" data-k="'+r.k.replace(/"/g,'&quot;')+
   '" aria-pressed="'+(state.dHidden[r.k]?'false':'true')+'"><i class="sw" style="background:'+
   DCOL[i%DCOL.length]+'"></i>'+r.k+'</button>';}).join('')+
  (shown.length<rows.length?'<button type="button" class="showall dshowall">Show all</button>':'');
 Array.prototype.forEach.call(lg.querySelectorAll('.dleg'),function(btn){
  btn.addEventListener('click',function(e){dPick(btn.getAttribute('data-k'),e.altKey);});});
 var sa=lg.querySelector('.dshowall');
 if(sa)sa.addEventListener('click',function(){state.dHidden={};drill();});
}

/* ---- sessions by day, one month at a time ---- */
/* The month chips come from the daily date axis rather than the monthly one:
   GA4 lags about two days, so a fresh month appears here as soon as it has a
   single day of data, without anything needing to be edited. */
function dailyMonths(){
 var seen={},out=[];
 D.dailyChannel.dates.forEach(function(d){
  var m=d.slice(0,7); if(!seen[m]){seen[m]=1;out.push(m);}});
 return out;
}
function monthSlice(mo){
 var dates=D.dailyChannel.dates,from=-1,to=-1;
 dates.forEach(function(d,i){ if(d.slice(0,7)===mo){ if(from<0)from=i; to=i; }});
 return {from:from,to:to};
}
function dailySeries(c){
 var t=D.dailyChannel.countries[c]||{};
 return t[state.ch==='all'?'all':state.ch]||[];
}
function dailyChart(){
 var months=dailyMonths();
 if(months.indexOf(state.month)<0)state.month=months[months.length-1];
 var vis=visible(),sl=monthSlice(state.month);
 var host=document.getElementById('ch4'); host.innerHTML='';
 var chipHost=document.getElementById('dayChips');
 chipHost.innerHTML=months.map(function(m){
  return '<button class="chip" type="button" data-m="'+m+'" aria-pressed="'+
   (state.month===m?'true':'false')+'">'+m+'</button>';}).join('');
 Array.prototype.forEach.call(chipHost.querySelectorAll('.chip'),function(b){
  b.addEventListener('click',function(){state.month=b.getAttribute('data-m');dailyChart();});});
 if(sl.from<0)return;
 var labels=[],idx=[];
 for(var i=sl.from;i<=sl.to;i++){labels.push(D.dailyChannel.dates[i].slice(8));idx.push(i);}
 lines(host,null,{labels:labels,h:320,dayAxis:true,
  series:vis.map(function(c){
   var a=dailySeries(c);
   return {name:c,color:COL[NAMES.indexOf(c)],
    data:idx.map(function(i){return a[i]||0;})};})});
 document.getElementById('lg4').innerHTML=vis.map(function(c){
  return '<span class="static"><i class="sw" style="background:'+COL[NAMES.indexOf(c)]+
   '"></i>'+c+'</span>';}).join('');
}

/* ---- bounce rate by month ---- */
function bounceChart(){
 var host=document.getElementById('ch5'); host.innerHTML='';
 var vis=visible(),key=state.ch==='all'?'all':state.ch;
 var series=vis.map(function(c){
  var arr=(D.bounce[c].bounce[key]||[]);
  return {name:c,color:COL[NAMES.indexOf(c)],
   data:M.map(function(_,i){var e=arr[i]||[0,0];return e[0]?e[1]:null;}),
   sess:M.map(function(_,i){var e=arr[i]||[0,0];return e[0];})};});
 /* break the line where there were no sessions rather than dropping it to zero --
    a flat 0% would read as "nobody bounced" instead of "nobody came". */
 lines(host,null,{labels:M,flagIdx:flagged(),h:320,onPick:pick,max:1,
  fmt:function(v){return Math.round(v*100)+'%';},series:series});
 document.getElementById('lg5').innerHTML=vis.map(function(c){
  return '<span class="static"><i class="sw" style="background:'+COL[NAMES.indexOf(c)]+
   '"></i>'+c+'</span>';}).join('');
}

/* ---- landing pages ---- */
function pageRows(){
 var vis=visible(),agg={},order=[];
 vis.forEach(function(c){
  ((D.pagesChannel[c].bounce[state.ch==='all'?'all':state.ch])||[]).forEach(function(r){
   var k=r[0];
   if(!agg[k]){agg[k]={s25:0,b25:0,s26:0,b26:0};order.push(k);}
   var a=agg[k];
   a.s25+=r[1]; a.b25+=r[1]*r[2];   /* session-weighted, summed then divided */
   a.s26+=r[4]; a.b26+=r[4]*r[5];});});
 return order.map(function(k){var a=agg[k];
   return {k:k,s25:a.s25,s26:a.s26,
    b25:a.s25?a.b25/a.s25:null,b26:a.s26?a.b26/a.s26:null};})
  .filter(function(r){return r.s26||r.s25;})
  .sort(function(x,y){return Math.max(y.s25,y.s26)-Math.max(x.s25,x.s26);}).slice(0,14);
}
function pageChart(){
 var host=document.getElementById('ch6'); host.innerHTML='';
 var rows=pageRows(); if(!rows.length){document.getElementById('lg6').innerHTML='';return;}
 var W=1120,L=300,R=70,T=10,rowH=30,H=T+rows.length*rowH+34,pw=W-L-R;
 var x=function(v){return L+v*pw;};
 var svg=el('svg',{viewBox:'0 0 '+W+' '+H,width:'100%'});
 for(var t=0;t<=1.0001;t+=0.25){
  svg.appendChild(el('line',{x1:x(t),x2:x(t),y1:T,y2:T+rows.length*rowH,
   stroke:t===0?'#9aa7b2':'var(--border)','stroke-width':t===0?1.4:1}));
  var tk=el('text',{x:x(t),y:H-14,'text-anchor':'middle','font-size':11,fill:'var(--muted)'});
  tk.textContent=Math.round(t*100)+'%'; svg.appendChild(tk);}
 rows.forEach(function(r,i){
  var y0=T+i*rowH;
  var lb=el('text',{x:L-12,y:y0+rowH/2+4,'text-anchor':'end','font-size':11.5,fill:'var(--navy)'});
  lb.textContent=r.k.length>44?r.k.slice(0,43)+'…':r.k;
  lb.appendChild(el('title')).textContent=r.k; svg.appendChild(lb);
  [[r.b25,r.s25,'#0B6E3A',2],[r.b26,r.s26,'#E67E22',12]].forEach(function(pp){
   if(pp[0]===null||!pp[1])return;
   var bar=el('rect',{x:L,y:y0+pp[3],width:Math.max(1,x(pp[0])-L),height:10,fill:pp[2],rx:2});
   bar.appendChild(el('title')).textContent=r.k+' · '+(pp[2]==='#0B6E3A'?'2025':'2026')+
    ' · '+Math.round(pp[0]*100)+'% of '+n(pp[1])+' sessions';
   svg.appendChild(bar);});
  var dl=el('text',{x:W-R+12,y:y0+rowH/2+4,'font-size':11,fill:'var(--muted)'});
  dl.textContent=n(r.s26||r.s25); svg.appendChild(dl);});
 host.appendChild(svg);
 document.getElementById('lg6').innerHTML=
  '<span class="static"><i class="sw" style="background:#0B6E3A"></i>Jan–Aug 2025</span>'+
  '<span class="static"><i class="sw" style="background:#E67E22"></i>Jan–Aug 2026</span>';
}

/* ---- sessions by landing page, monthly ---- */
function pmRows(){
 var vis=visible(),agg={},order=[];
 vis.forEach(function(c){
  var t=(D.pagesChannel[c].monthly[state.ch==='all'?'all':state.ch])||{};
  Object.keys(t).forEach(function(pg){
   if(!agg[pg]){agg[pg]=M.map(function(){return 0;});order.push(pg);}
   t[pg].forEach(function(v,i){agg[pg][i]+=v;});});});
 return order.map(function(k){
   var a=agg[k];return {k:k,data:a,tot:a.reduce(function(x,y){return x+y;},0)};})
  .filter(function(r){return r.tot>0;})
  .sort(function(x,y){return y.tot-x.tot;}).slice(0,8);
}
function pmPick(k,alt){
 var names=pmRows().map(function(r){return r.k;});
 var vis=names.filter(function(x){return !state.pHidden[x];});
 if(alt){ if(!state.pHidden[k]&&vis.length===1)return; state.pHidden[k]=!state.pHidden[k]; }
 else if(vis.length===1&&vis[0]===k){ state.pHidden={}; }
 else { state.pHidden={}; names.forEach(function(o){if(o!==k)state.pHidden[o]=true;}); }
 pageMonthly();
}
function pageMonthly(){
 var rows=pmRows(),host=document.getElementById('ch7'),lg=document.getElementById('lg7');
 host.innerHTML='';
 if(!rows.length){lg.innerHTML='';return;}
 var shown=rows.filter(function(r){return !state.pHidden[r.k];});
 if(!shown.length){state.pHidden={};shown=rows;}
 lines(host,null,{labels:M,flagIdx:flagged(),h:330,onPick:pmPick,
  fmt:function(v){return v>=1000?(v/1000)+'k':''+v;},
  series:shown.map(function(r){
   return {name:r.k,color:DCOL[rows.indexOf(r)%DCOL.length],data:r.data};})});
 lg.innerHTML=rows.map(function(r,i){
  return '<button type="button" class="pleg" data-k="'+r.k.replace(/"/g,'&quot;')+
   '" aria-pressed="'+(state.pHidden[r.k]?'false':'true')+'"><i class="sw" style="background:'+
   DCOL[i%DCOL.length]+'"></i>'+r.k+'</button>';}).join('')+
  (shown.length<rows.length?'<button type="button" class="showall pshowall">Show all</button>':'');
 Array.prototype.forEach.call(lg.querySelectorAll('.pleg'),function(b){
  b.addEventListener('click',function(e){pmPick(b.getAttribute('data-k'),e.altKey);});});
 var sa=lg.querySelector('.pshowall');
 if(sa)sa.addEventListener('click',function(){state.pHidden={};pageMonthly();});
}

/* ---- chips ---- */
function label(k){return k==='all'?'All channels':k;}
function drawChips(){
 var keys=['all'].concat(D.channelOrder);
 document.getElementById('chips').innerHTML=keys.map(function(k){
  return '<button class="chip" type="button" data-ch="'+k+'" aria-pressed="'+
   (state.ch===k?'true':'false')+'">'+label(k)+'</button>';}).join('');
 Array.prototype.forEach.call(document.querySelectorAll('#chips .chip'),function(b){
  b.addEventListener('click',function(){state.ch=b.getAttribute('data-ch');
   state.dHidden={};state.pHidden={};render();});});}
function render(){drawChips();charts();drill();dailyChart();bounceChart();pageChart();pageMonthly();}
render();


window.CT.D=D; window.CT.FLAG=FLAG; window.CT.flagged=flagged; window.CT.lines=lines; window.CT.pct=pct;
window.CT.state=state; window.CT.render=render; window.CT.pick=pick;
window.CT.drillRows=drillRows; window.CT.dailyChart=dailyChart; window.CT.bounceChart=bounceChart;
window.CT.dailyMonths=dailyMonths; window.CT.dailySeries=dailySeries;
window.CT.pageChart=pageChart; window.CT.pageRows=pageRows;
window.CT.pageMonthly=pageMonthly; window.CT.pmRows=pmRows; window.CT.pmPick=pmPick; window.CT.monthSlice=monthSlice; window.CT.dPick=dPick; window.CT.drill=drill;
window.CT.visible=visible; window.CT.NAMES=NAMES; window.CT.series=series; window.CT.sum=sum;
window.CT.P25=P25; window.CT.P26=P26; window.CT.P25c=P25c; window.CT.P26c=P26c;
})();
